<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link rel="icon" href="https://www.specsolid.com/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="https://www.specsolid.com/favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="https://www.specsolid.com/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://www.specsolid.com/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://www.specsolid.com/apple-touch-icon.png"></head>
<script>
// GitHub Pages SPA redirect: /section/file-slug → /section/?slug=file-slug
// viewer.js reads ?slug= and restores the clean URL via history.replaceState
(function () {
  var parts = window.location.pathname.split('/').filter(Boolean);
  if (parts.length >= 2) {
    var section = parts[parts.length - 2];
    var slug    = parts[parts.length - 1];
    window.location.replace('/' + section + '/?slug=' + encodeURIComponent(slug));
  } else {
    window.location.replace('/');
  }
})();
</script>
</html>
